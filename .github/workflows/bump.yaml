name: bump

on:
  schedule:
    - cron: "0 22 * * *" # every day at 22:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "force"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

concurrency:
  group: release

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: spotdemo4/better-checkout@caa4005d39c5ed24e309c1272e774d0319bbed7d # v0.14.0
        with:
          app-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          fetch-depth: 0

      - name: Bump
        uses: spotdemo4/bumper@f008c887b1fb9b08cc7e60f658dc9a3b5ff58df9 # v0.28.0
        with:
          github_token: ${{ steps.checkout.outputs.token }}
          debug: ${{ runner.debug }}
          force: ${{ inputs.force }}
          files: README.md
