name: bump

on:
  schedule:
    - cron: "0 22 * * *" # every day at 22:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "force"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

concurrency:
  group: release

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: spotdemo4/better-checkout@ab7dfe8d48335ef0a98a0edeca2c4e95cd7fd547 # v0.16.0
        with:
          app-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          fetch-depth: 0

      - name: Bump
        uses: spotdemo4/bumper@857d9752562b28c63d5f7d9deafb7d7dc0b05981 # v0.33.0
        with:
          github_token: ${{ steps.checkout.outputs.token }}
          debug: ${{ runner.debug }}
          force: ${{ inputs.force }}
          files: README.md
