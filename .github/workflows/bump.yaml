name: bump

on:
  schedule:
    - cron: "0 22 * * *" # every day at 22:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "force"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

concurrency:
  group: release

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: spotdemo4/better-checkout@d44e490a0dce276fb597c634b1cdb5ffc1b26dfc # v0.17.0
        with:
          app-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          fetch-depth: 0

      - name: Bump
        uses: spotdemo4/bumper@a3157a3291259da1bb6bcfd2d3fc025a1bb85701 # v0.38.0
        with:
          github_token: ${{ steps.checkout.outputs.token }}
          debug: ${{ runner.debug }}
          force: ${{ inputs.force }}
          files: README.md
