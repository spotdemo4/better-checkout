name: bump

on:
  schedule:
    - cron: "0 22 * * *" # every day at 22:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "force"
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

concurrency:
  group: release

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: spotdemo4/better-checkout@1e018987ece41c726c52ec922104bf4a5938ec05 # v0.12.0
        with:
          app-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          fetch-depth: 0

      - name: Bump
        uses: spotdemo4/bumper@e665e46fc7aa2fa10ef8997e1d47fe646bc3de27 # v0.18.1
        with:
          github_token: ${{ steps.checkout.outputs.token }}
          debug: ${{ runner.debug }}
          force: ${{ inputs.force }}
          files: README.md
